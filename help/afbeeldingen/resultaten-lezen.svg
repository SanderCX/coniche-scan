<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" width="100%">
<title>Staafdiagram Per categorie met per categorie een staaf voor je eigen score, een stip met het gemiddelde van de groep, een grijze lijn van de laagste tot de hoogste score en twee stippellijnen bij 2,5 en 3,5</title>
<rect x="0" y="0" width="800" height="330" rx="10" fill="var(--bg)"/>
<line x1="60" y1="250" x2="640" y2="250" stroke="var(--border)" stroke-width="1"/><text x="48" y="254" text-anchor="end" font-size="12" fill="var(--ink-s)">1</text>
<line x1="60" y1="195" x2="640" y2="195" stroke="var(--border)" stroke-width="1"/><text x="48" y="199" text-anchor="end" font-size="12" fill="var(--ink-s)">2</text>
<line x1="60" y1="140" x2="640" y2="140" stroke="var(--border)" stroke-width="1"/><text x="48" y="144" text-anchor="end" font-size="12" fill="var(--ink-s)">3</text>
<line x1="60" y1="85" x2="640" y2="85" stroke="var(--border)" stroke-width="1"/><text x="48" y="89" text-anchor="end" font-size="12" fill="var(--ink-s)">4</text>
<line x1="60" y1="30" x2="640" y2="30" stroke="var(--border)" stroke-width="1"/><text x="48" y="34" text-anchor="end" font-size="12" fill="var(--ink-s)">5</text>
<line x1="60" y1="167.5" x2="640" y2="167.5" stroke="#9a978f" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="60" y1="112.5" x2="640" y2="112.5" stroke="#9a978f" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="650" y="171.5" font-size="12" fill="var(--ink-s)">2,5: grens Uitbouwen</text>
<text x="650" y="116.5" font-size="12" fill="var(--ink-s)">3,5: grens Sterk punt</text>
<rect x="100" y="156.5" width="48" height="93.5" fill="var(--or)" rx="3"/>
<text x="124" y="148.5" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)">2,7</text>
<line x1="168" y1="118.0" x2="168" y2="195.0" stroke="#b3b0a8" stroke-width="2"/>
