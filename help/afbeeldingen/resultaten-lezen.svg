<text x="566" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink-m)">Fundament</text>
<g data-nr="1"><circle cx="76" cy="162.5" r="11" fill="var(--ink)"/><text x="76" y="167.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text></g>
<g data-nr="2"><circle cx="180" cy="111.5" r="11" fill="var(--ink)"/><text x="180" y="116.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text></g>
<g data-nr="3"><circle cx="250" cy="65.50000000000003" r="11" fill="var(--ink)"/><text x="250" y="70.00000000000003" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text></g>
<g data-nr="4"><circle cx="34" cy="112.5" r="11" fill="var(--ink)"/><text x="34" y="117.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text></g>
<text x="60" y="310" font-size="12" fill="var(--ink-s)">Scores van 1 tot 5. Voorbeelddata.</text>
</svg>
