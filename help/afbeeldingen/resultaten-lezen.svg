<rect x="208" y="118.0" width="48" height="132.0" fill="var(--bl)" rx="3"/>
<text x="232" y="110.0" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)">3,4</text>
<line x1="276" y1="79.50000000000003" x2="276" y2="151.0" stroke="#b3b0a8" stroke-width="2"/>
