<rect x="424" y="96.0" width="48" height="154.0" fill="var(--gr)" rx="3"/>
<text x="448" y="88.0" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)">3,8</text>
<line x1="492" y1="62.99999999999997" x2="492" y2="140.0" stroke="#b3b0a8" stroke-width="2"/>
<circle cx="492" cy="101.5" r="7" fill="var(--gr)" stroke="#fff" stroke-width="2"/>
<text x="458" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink-m)">Mens</text>
<rect x="532" y="178.5" width="48" height="71.5" fill="var(--ye)" rx="3"/>
<text x="556" y="170.5" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)">2,3</text>
<line x1="600" y1="140.0" x2="600" y2="200.5" stroke="#b3b0a8" stroke-width="2"/>
