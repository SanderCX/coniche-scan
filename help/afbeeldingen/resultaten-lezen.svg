<text x="242" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink-m)">Organisatie</text>
<rect x="316" y="134.5" width="48" height="115.5" fill="var(--pu)" rx="3"/>
<text x="340" y="126.5" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)">3,1</text>
<line x1="384" y1="90.5" x2="384" y2="167.5" stroke="#b3b0a8" stroke-width="2"/>
